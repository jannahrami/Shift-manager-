<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shift Manager — دفتر العمليات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   نظام التصميم — "دفتر العمليات" (Operations Log)
   مبني على طبيعة الشغل: مناوبات أمن صناعي/بحري، مو SaaS عام.
   ============================================================ */
:root{
  --ink:#15191d; --ink-2:#1d2329;
  --sand:#ede7d9; --sand-2:#f5f1e6; --paper:#fffdf8;
  --amber:#c77d22; --amber-ink:#5c3812;
  --green:#4c7a54; --green-ink:#22381f;
  --red:#a33d2e; --red-ink:#4a1912;
  --blue:#3e5c6b; --blue-ink:#1a2b32;
  --line:#dcd4bf; --text:#22201a; --muted:#71695a;
  --radius:6px; --font:'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--sand);color:var(--text);font-weight:400;line-height:1.6;min-height:100vh}

/* شريط علوي ثابت — لوحة القيادة، مو Topbar SaaS */
.command-bar{background:var(--ink);color:#f2efe6;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;border-bottom:3px solid var(--amber)}
.command-bar .brand{font-weight:600;font-size:16px;letter-spacing:.3px}
.command-bar .brand small{display:block;font-weight:400;font-size:11px;color:#a8a196;margin-top:2px}
.command-bar .who{font-size:12px;color:#c9c3b5;display:flex;align-items:center;gap:10px}
.command-bar button{background:transparent;border:1px solid #3a4149;color:#e8e4d9;font:inherit;font-size:12px;padding:6px 12px;border-radius:var(--radius);cursor:pointer}
.command-bar button:hover{border-color:var(--amber);color:var(--amber)}

.layout{display:flex;max-width:1100px;margin:0 auto;min-height:calc(100vh - 62px)}
.layout>main{flex:1;padding:20px;min-width:0}

/* الشريط الجانبي — حالة الشفت ثابتة، مو بطاقة تنزل مع التمرير */
.status-rail{width:230px;flex:0 0 auto;background:var(--ink);color:#eee9dc;padding:20px 16px;position:sticky;top:62px;align-self:flex-start;height:calc(100vh - 62px);border-left:3px solid var(--amber)}
.status-rail .eyebrow{font-size:10px;color:#8a8375;margin-bottom:4px}
.status-rail h2{font-size:20px;font-weight:600;margin-bottom:14px}
.status-rail .stat{padding:10px 0;border-top:1px solid #2a3038}
.status-rail .stat .n{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.status-rail .stat .l{font-size:11px;color:#9a927f}
.status-rail nav{margin-top:24px;display:flex;flex-direction:column;gap:2px}
.status-rail nav button{background:none;border:0;color:#c9c3b5;font:inherit;font-size:13px;text-align:right;padding:9px 10px;border-radius:var(--radius);cursor:pointer}
.status-rail nav button.active{background:var(--amber);color:#241505;font-weight:600}
.status-rail nav button:not(.active):hover{background:#20262d;color:#f2efe6}

/* أقسام — تبويب ملوّن على الحافة بدل بطاقة موحّدة الشكل */
.dossier{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
.dossier-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dossier-head h3{font-size:15px;font-weight:600}
.dossier-head .eyebrow{font-size:10px;color:var(--muted);display:block;margin-bottom:2px}
.dossier.amber{border-right:4px solid var(--amber)}
.dossier.green{border-right:4px solid var(--green)}
.dossier.blue{border-right:4px solid var(--blue)}
.dossier.red{border-right:4px solid var(--red)}
.dossier-body{padding:16px 18px}

.row-list{display:flex;flex-direction:column}
.row-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #ece5d3}
.row-item:last-child{border-bottom:0}
.row-item .name{font-size:13px;font-weight:600}
.row-item .meta{font-size:11px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;font-size:10px;font-weight:600;padding:3px 8px;border-radius:3px}
.tag.on{background:#e3ede4;color:var(--green-ink)}
.tag.off{background:#f2e3de;color:var(--amber-ink)}

.btn{font:inherit;font-size:12px;font-weight:600;padding:8px 14px;border-radius:var(--radius);border:1px solid var(--ink);background:var(--ink);color:#f2efe6;cursor:pointer}
.btn:hover{background:var(--ink-2)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}

input,select{font:inherit;font-size:13px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;width:100%}
input:focus,select:focus{outline:2px solid var(--amber);outline-offset:1px}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

.empty{padding:28px 10px;text-align:center;color:var(--muted);font-size:12px}

/* شاشة الدخول */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);padding:20px}
.gate-card{background:var(--paper);border-radius:var(--radius);padding:32px 28px;width:100%;max-width:360px;border-top:4px solid var(--amber)}
.gate-card h1{font-size:19px;font-weight:600;margin-bottom:3px}
.gate-card .eyebrow{font-size:11px;color:var(--muted);margin-bottom:20px;display:block}
.gate-msg{font-size:12px;color:var(--red-ink);margin-top:8px;min-height:16px}
.hidden{display:none!important}

@media(max-width:760px){
  .layout{flex-direction:column}
  .status-rail{width:100%;position:relative;top:0;height:auto;border-left:0;border-bottom:3px solid var(--amber)}
  .status-rail nav{flex-direction:row;overflow-x:auto;gap:6px}
  .status-rail nav button{white-space:nowrap}
}
</style>
</head>
<body>

<div id="gate" class="gate">
  <div class="gate-card">
    <span class="eyebrow">SHIFT MANAGER — دفتر العمليات</span>
    <h1>تسجيل الدخول</h1>
    <div class="field" style="margin-top:18px">
      <label>البريد الإلكتروني</label>
      <input id="loginEmail" type="email" placeholder="name@example.com" autocomplete="username">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input id="loginPassword" type="password" autocomplete="current-password">
    </div>
    <button class="btn" style="width:100%;margin-top:6px" onclick="login()">دخول</button>
    <div class="gate-msg" id="gateMsg"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="command-bar">
    <div class="brand">Shift Manager<small>دفتر العمليات · Group A</small></div>
    <div class="who">
      <span id="whoLabel">—</span>
      <button onclick="logout()">خروج</button>
    </div>
  </div>
  <div class="layout">
    <aside class="status-rail">
      <span class="eyebrow">حالة اليوم</span>
      <h2 id="todayLabel">—</h2>
      <div class="stat"><div class="n" id="statOnDuty">—</div><div class="l">على رأس العمل</div></div>
      <div class="stat"><div class="n" id="statOnLeave">—</div><div class="l">في إجازة الآن</div></div>
      <div class="stat"><div class="n" id="statTotal">—</div><div class="l">إجمالي الموظفين</div></div>
      <nav>
        <button class="active" data-view="employees" onclick="showView('employees')">الموظفون</button>
        <button data-view="leaves" onclick="showView('leaves')">الإجازات</button>
      </nav>
    </aside>
    <main>

      <section id="view-employees">
        <div class="dossier amber">
          <div class="dossier-head">
            <div><span class="eyebrow">القوة العاملة</span><h3>الموظفون</h3></div>
          </div>
          <div class="dossier-body">
            <div class="row-list" id="employeesList"><div class="empty">جاري التحميل…</div></div>
          </div>
        </div>
      </section>

      <section id="view-leaves" class="hidden">
        <div class="dossier green">
          <div class="dossier-head">
            <div><span class="eyebrow">تسجيل جديد</span><h3>إضافة إجازة</h3></div>
          </div>
          <div class="dossier-body">
            <div class="form-row">
              <div class="field"><label>الموظف</label><select id="leaveEmployee"></select></div>
              <div class="field"><label>من تاريخ</label><input id="leaveStart" type="date"></div>
              <div class="field"><label>إلى تاريخ</label><input id="leaveEnd" type="date"></div>
            </div>
            <button class="btn" onclick="addLeave()">حفظ الإجازة</button>
            <div class="gate-msg" id="leaveMsg"></div>
          </div>
        </div>
        <div class="dossier blue">
          <div class="dossier-head">
            <div><span class="eyebrow">السجل</span><h3>الإجازات الحالية والقادمة</h3></div>
          </div>
          <div class="dossier-body">
            <div class="row-list" id="leavesList"><div class="empty">جاري التحميل…</div></div>
          </div>
        </div>
      </section>

    </main>
  </div>
</div>

<script>
/* ============================================================
   الإعدادات — نفس مشروع Supabase والجدول المستخدم بالنسخة الحالية
   ============================================================ */
const SUPABASE_URL = 'https://gfpzjydgcmwwrxrvmreq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_VJ17gLtZ7CAHnpOP6G1yqw_CxvZgyrz';
const ADMIN_EMAIL = 'jannahrami@yahoo.com';

let session = null;
let state = { employees: [], leaves: [] };

/* ============================================================
   طبقة البيانات — نفس جدول shift_manager_state، نفس بنية الحقول
   ============================================================ */
async function supabaseFetch(path, options = {}) {
  const headers = { apikey: SUPABASE_KEY, 'Content-Type': 'application/json', ...(options.headers || {}) };
  if (session?.access_token) headers.Authorization = 'Bearer ' + session.access_token;
  return fetch(SUPABASE_URL + path, { ...options, headers });
}

async function login() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const msg = document.getElementById('gateMsg');
  msg.textContent = 'جاري الدخول…';
  try {
    const res = await supabaseFetch('/auth/v1/token?grant_type=password', {
      method: 'POST',
      body: JSON.stringify({ email, password })
    });
    if (!res.ok) { msg.textContent = 'بيانات الدخول غير صحيحة'; return; }
    session = await res.json();
    msg.textContent = '';
    await loadState();
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('whoLabel').textContent = session.user?.email === ADMIN_EMAIL ? 'Admin' : session.user?.email || '';
  } catch (e) {
    msg.textContent = 'تعذر الاتصال، تأكد من الإنترنت';
  }
}

function logout() {
  session = null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('gate').classList.remove('hidden');
}

async function loadState() {
  const res = await supabaseFetch('/rest/v1/shift_manager_state?id=eq.main&select=data', { method: 'GET' });
  if (!res.ok) return;
  const rows = await res.json();
  if (rows[0]?.data) {
    state.employees = rows[0].data.employees || [];
    state.leaves = rows[0].data.leaves || [];
  }
  renderAll();
}

/* ============================================================
   العرض
   ============================================================ */
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function fmtDate(s) {
  if (!s) return '';
  return new Date(s + 'T12:00:00').toLocaleDateString('ar-SA-u-ca-gregory', { day: '2-digit', month: '2-digit', year: 'numeric' });
}
function displayName(e) { return e?.nameAr || e?.name || 'غير معروف'; }
function isOnLeave(employeeId) {
  const t = todayISO();
  return state.leaves.some(l => l.employeeId === employeeId && l.start <= t && l.end >= t);
}

function renderStatusRail() {
  const t = todayISO();
  document.getElementById('todayLabel').textContent = fmtDate(t);
  const onLeave = state.employees.filter(e => isOnLeave(e.id)).length;
  document.getElementById('statTotal').textContent = state.employees.length;
  document.getElementById('statOnLeave').textContent = onLeave;
  document.getElementById('statOnDuty').textContent = state.employees.length - onLeave;
}

function renderEmployees() {
  const box = document.getElementById('employeesList');
  if (!state.employees.length) { box.innerHTML = '<div class="empty">لا يوجد موظفون مسجّلون</div>'; return; }
  box.innerHTML = state.employees.map(e => {
    const onLeave = isOnLeave(e.id);
    return `<div class="row-item">
      <div><div class="name">${escapeHtml(displayName(e))}</div><div class="meta">#${escapeHtml(e.empId || '')}</div></div>
      <span class="tag ${onLeave ? 'off' : 'on'}">${onLeave ? 'إجازة' : 'دوام'}</span>
    </div>`;
  }).join('');
}

function renderLeaveEmployeeSelect() {
  const sel = document.getElementById('leaveEmployee');
  sel.innerHTML = state.employees.map(e => `<option value="${e.id}">${escapeHtml(displayName(e))}</option>`).join('');
}

function renderLeaves() {
  const box = document.getElementById('leavesList');
  const t = todayISO();
  const upcoming = [...state.leaves].filter(l => l.end >= t).sort((a, b) => a.start.localeCompare(b.start));
  if (!upcoming.length) { box.innerHTML = '<div class="empty">لا توجد إجازات حالية أو قادمة</div>'; return; }
  box.innerHTML = upcoming.map(l => {
    const emp = state.employees.find(e => e.id === l.employeeId);
    return `<div class="row-item">
      <div><div class="name">${escapeHtml(emp ? displayName(emp) : 'موظف محذوف')}</div><div class="meta">${fmtDate(l.start)} — ${fmtDate(l.end)}</div></div>
    </div>`;
  }).join('');
}

function renderAll() {
  renderStatusRail();
  renderEmployees();
  renderLeaveEmployeeSelect();
  renderLeaves();
}

function escapeHtml(s = '') {
  return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
}

/* ============================================================
   التنقل
   ============================================================ */
function showView(name) {
  document.querySelectorAll('.status-rail nav button').forEach(b => b.classList.toggle('active', b.dataset.view === name));
  document.getElementById('view-employees').classList.toggle('hidden', name !== 'employees');
  document.getElementById('view-leaves').classList.toggle('hidden', name !== 'leaves');
}

/* ============================================================
   إضافة إجازة (تحقق أولًا، تنفيذ مباشر بعده — نفس مبدأ النسخة الحالية)
   ============================================================ */
async function addLeave() {
  const employeeId = document.getElementById('leaveEmployee').value;
  const start = document.getElementById('leaveStart').value;
  const end = document.getElementById('leaveEnd').value;
  const msg = document.getElementById('leaveMsg');
  if (!employeeId || !start || !end) { msg.textContent = 'عبّي كل الحقول'; return; }
  if (end < start) { msg.textContent = 'تاريخ النهاية قبل البداية'; return; }
  const conflict = state.leaves.find(l => l.employeeId === employeeId && l.start <= end && l.end >= start);
  if (conflict) { msg.textContent = 'يوجد تداخل مع إجازة مسجّلة لنفس الموظف'; return; }

  state.leaves.push({ id: crypto.randomUUID(), employeeId, start, end, source: 'v2' });
  msg.textContent = 'جاري الحفظ…';
  const res = await supabaseFetch('/rest/v1/shift_manager_state?on_conflict=id', {
    method: 'POST',
    headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify({ id: 'main', data: state, updated_at: new Date().toISOString() })
  });
  if (res.ok) { msg.textContent = 'تم الحفظ ✓'; renderAll(); }
  else { msg.textContent = 'تعذر الحفظ'; state.leaves.pop(); }
}
</script>
</body>
</html>
