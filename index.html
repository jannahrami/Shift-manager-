<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shift Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface-2:#f4f5f7;
  --blue:#2f6fed; --blue-tint:#eaf1ff;
  --green:#1c9a6c; --green-tint:#e7f8f0;
  --red:#e0463d; --red-tint:#fdecec;
  --text:#15181d; --text-2:#5c6470; --text-3:#9aa1ab;
  --line:#e7e9ec;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(20,24,32,.04), 0 8px 20px rgba(20,24,32,.06);
  --font:'IBM Plex Sans Arabic','Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-weight:400;line-height:1.55;min-height:100vh;padding-bottom:78px;-webkit-font-smoothing:antialiased}

.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}
.topbar .brand{font-size:15px;font-weight:600}
.topbar .brand small{display:block;font-weight:400;font-size:11px;color:var(--text-3);margin-top:1px}
.topbar .avatar{width:30px;height:30px;border-radius:50%;background:var(--blue-tint);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}

main{max-width:640px;margin:0 auto;padding:16px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-head h3{font-size:14px;font-weight:600}
.eyebrow{font-size:11px;color:var(--text-3);display:block;margin-bottom:2px}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stat-grid>div{padding:2px 4px}
.stat-grid>div+div{border-right:1px solid var(--line)}
.stat-grid .n{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat-grid .l{font-size:11px;color:var(--text-2);margin-top:2px}

.row-list{display:flex;flex-direction:column}
.row-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row-item:last-child{border-bottom:0}
.row-item .av{width:30px;height:30px;border-radius:50%;background:var(--surface-2);color:var(--text-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:0 0 auto}
.row-item .info{flex:1;min-width:0}
.row-item .name{font-size:13px;font-weight:500}
.row-item .meta{font-size:11px;color:var(--text-3);margin-top:1px}

.pill{font-size:11px;font-weight:500;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.on{background:var(--green-tint);color:var(--green)}
.pill.off{background:var(--blue-tint);color:var(--blue)}

.btn{font:inherit;font-size:13px;font-weight:500;padding:10px 16px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;box-shadow:var(--shadow)}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}

input,select{font:inherit;font-size:13px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);width:100%}
input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-tint)}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;color:var(--text-2);margin-bottom:5px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}

.empty{padding:26px 10px;text-align:center;color:var(--text-3);font-size:12px}
.hint{font-size:12px;margin-top:8px;min-height:16px}
.hint.err{color:var(--red)}
.hint.ok{color:var(--green)}

.hidden{display:none!important}

.bottom-nav{position:fixed;bottom:0;right:0;left:0;background:var(--surface);border-top:1px solid var(--line);display:flex;overflow-x:auto;z-index:40;box-shadow:0 -1px 2px rgba(20,24,32,.03)}
.navbtn{flex:0 0 auto;min-width:64px;background:none;border:0;color:var(--text-3);font:inherit;font-size:10px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.navbtn i{font-size:18px;font-style:normal}
.navbtn.active{color:var(--blue)}
.navbtn.soon{opacity:.4}

.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 26px;width:100%;max-width:340px}
.gate-card h1{font-size:17px;font-weight:600;margin-bottom:3px}
.gate-card .eyebrow{margin-bottom:22px}
</style>
</head>
<body>

<div id="gate" class="gate">
  <div class="gate-card">
    <span class="eyebrow">SHIFT MANAGER</span>
    <h1>تسجيل الدخول</h1>
    <div class="field" style="margin-top:18px">
      <label>البريد الإلكتروني</label>
      <input id="loginEmail" type="email" placeholder="name@example.com" autocomplete="username">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input id="loginPassword" type="password" autocomplete="current-password">
    </div>
    <button class="btn primary block" onclick="login()">دخول</button>
    <div class="hint err" id="gateMsg"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="topbar">
    <div class="brand">Shift Manager<small>لوحة إدارة الشفت · Group A</small></div>
    <div style="display:flex;align-items:center;gap:10px">
      <span id="whoLabel" style="font-size:12px;color:var(--text-2)"></span>
      <div class="avatar">S</div>
    </div>
  </div>

  <main>
    <section id="view-home">
      <div class="card">
        <div class="stat-grid">
          <div><div class="n" id="statOnDuty">—</div><div class="l">على رأس العمل</div></div>
          <div><div class="n" id="statOnLeave">—</div><div class="l">في إجازة</div></div>
          <div><div class="n" id="statTotal">—</div><div class="l">الإجمالي</div></div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><div><span class="eyebrow">القوة العاملة</span><h3>الموظفون</h3></div></div>
        <div class="row-list" id="employeesList"><div class="empty">جاري التحميل…</div></div>
      </div>
    </section>

    <section id="view-leaves" class="hidden">
      <div class="card">
        <div class="card-head"><div><span class="eyebrow">تسجيل جديد</span><h3>إضافة إجازة</h3></div></div>
        <div class="form-row">
          <div class="field" style="margin-bottom:0"><label>الموظف</label><select id="leaveEmployee"></select></div>
          <div class="field" style="margin-bottom:0"><label>من تاريخ</label><input id="leaveStart" type="date"></div>
          <div class="field" style="margin-bottom:0"><label>إلى تاريخ</label><input id="leaveEnd" type="date"></div>
        </div>
        <button class="btn primary" onclick="addLeave()">حفظ الإجازة</button>
        <div class="hint" id="leaveMsg"></div>
      </div>
      <div class="card">
        <div class="card-head"><div><span class="eyebrow">السجل</span><h3>الإجازات الحالية والقادمة</h3></div></div>
        <div class="row-list" id="leavesList"><div class="empty">جاري التحميل…</div></div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="navbtn soon" data-view="insights" disabled><i>📊</i>المؤشرات</button>
    <button class="navbtn active" data-view="home" onclick="showView('home')"><i>🏠</i>الرئيسية</button>
    <button class="navbtn" data-view="leaves" onclick="showView('leaves')"><i>🗓️</i>الإجازات</button>
    <button class="navbtn soon" data-view="calendar" disabled><i>▦</i>التقويم</button>
    <button class="navbtn soon" data-view="shift" disabled><i>🛡️</i>الشفت</button>
    <button class="navbtn soon" data-view="reports" disabled><i>📈</i>التقارير</button>
    <button class="navbtn soon" data-view="updates" disabled><i>📌</i>تحديثات</button>
    <button class="navbtn soon" data-view="forms" disabled><i>📎</i>نماذج</button>
  </nav>
</div>

<script>
const SUPABASE_URL = 'https://gfpzjydgcmwwrxrvmreq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_VJ17gLtZ7CAHnpOP6G1yqw_CxvZgyrz';
const ADMIN_EMAIL = 'jannahrami@yahoo.com';

let session = null;
let state = { employees: [], leaves: [] };

async function supabaseFetch(path, options = {}) {
  const headers = { apikey: SUPABASE_KEY, 'Content-Type': 'application/json', ...(options.headers || {}) };
  if (session?.access_token) headers.Authorization = 'Bearer ' + session.access_token;
  return fetch(SUPABASE_URL + path, { ...options, headers });
}

async function login() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const msg = document.getElementById('gateMsg');
  msg.textContent = 'جاري الدخول…';
  try {
    const res = await supabaseFetch('/auth/v1/token?grant_type=password', {
      method: 'POST',
      body: JSON.stringify({ email, password })
    });
    if (!res.ok) { msg.textContent = 'بيانات الدخول غير صحيحة'; return; }
    session = await res.json();
    msg.textContent = '';
    await loadState();
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('whoLabel').textContent = session.user?.email === ADMIN_EMAIL ? 'Admin' : session.user?.email || '';
  } catch (e) {
    msg.textContent = 'تعذر الاتصال، تأكد من الإنترنت';
  }
}

async function loadState() {
  const res = await supabaseFetch('/rest/v1/shift_manager_state?id=eq.main&select=data', { method: 'GET' });
  if (!res.ok) return;
  const rows = await res.json();
  if (rows[0]?.data) {
    state.employees = rows[0].data.employees || [];
    state.leaves = rows[0].data.leaves || [];
  }
  renderAll();
}

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function fmtDate(s) {
  if (!s) return '';
  return new Date(s + 'T12:00:00').toLocaleDateString('ar-SA-u-ca-gregory', { day: '2-digit', month: '2-digit', year: 'numeric' });
}
function displayName(e) { return e?.nameAr || e?.name || 'غير معروف'; }
function initials(n) { return (n || '؟').trim().split(/\s+/).slice(0, 2).map(x => x[0]).join(''); }
function isOnLeave(employeeId) {
  const t = todayISO();
  return state.leaves.some(l => l.employeeId === employeeId && l.start <= t && l.end >= t);
}
function escapeHtml(s = '') {
  return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
}

function renderStats() {
  const onLeave = state.employees.filter(e => isOnLeave(e.id)).length;
  document.getElementById('statTotal').textContent = state.employees.length;
  document.getElementById('statOnLeave').textContent = onLeave;
  document.getElementById('statOnDuty').textContent = state.employees.length - onLeave;
}

function renderEmployees() {
  const box = document.getElementById('employeesList');
  if (!state.employees.length) { box.innerHTML = '<div class="empty">لا يوجد موظفون مسجّلون</div>'; return; }
  box.innerHTML = state.employees.map(e => {
    const onLeave = isOnLeave(e.id);
    return `<div class="row-item">
      <div class="av">${escapeHtml(initials(displayName(e)))}</div>
      <div class="info"><div class="name">${escapeHtml(displayName(e))}</div><div class="meta">#${escapeHtml(e.empId || '')}</div></div>
      <span class="pill ${onLeave ? 'off' : 'on'}">${onLeave ? 'إجازة' : 'دوام'}</span>
    </div>`;
  }).join('');
}

function renderLeaveEmployeeSelect() {
  const sel = document.getElementById('leaveEmployee');
  sel.innerHTML = state.employees.map(e => `<option value="${e.id}">${escapeHtml(displayName(e))}</option>`).join('');
}

function renderLeaves() {
  const box = document.getElementById('leavesList');
  const t = todayISO();
  const upcoming = [...state.leaves].filter(l => l.end >= t).sort((a, b) => a.start.localeCompare(b.start));
  if (!upcoming.length) { box.innerHTML = '<div class="empty">لا توجد إجازات حالية أو قادمة</div>'; return; }
  box.innerHTML = upcoming.map(l => {
    const emp = state.employees.find(e => e.id === l.employeeId);
    return `<div class="row-item">
      <div class="av">${escapeHtml(initials(emp ? displayName(emp) : '؟'))}</div>
      <div class="info"><div class="name">${escapeHtml(emp ? displayName(emp) : 'موظف محذوف')}</div><div class="meta">${fmtDate(l.start)} — ${fmtDate(l.end)}</div></div>
    </div>`;
  }).join('');
}

function renderAll() {
  renderStats();
  renderEmployees();
  renderLeaveEmployeeSelect();
  renderLeaves();
}

function showView(name) {
  document.querySelectorAll('.bottom-nav .navbtn').forEach(b => b.classList.toggle('active', b.dataset.view === name));
  document.getElementById('view-home').classList.toggle('hidden', name !== 'home');
  document.getElementById('view-leaves').classList.toggle('hidden', name !== 'leaves');
}

async function addLeave() {
  const employeeId = document.getElementById('leaveEmployee').value;
  const start = document.getElementById('leaveStart').value;
  const end = document.getElementById('leaveEnd').value;
  const msg = document.getElementById('leaveMsg');
  msg.className = 'hint';
  if (!employeeId || !start || !end) { msg.textContent = 'عبّي كل الحقول'; msg.classList.add('err'); return; }
  if (end < start) { msg.textContent = 'تاريخ النهاية قبل البداية'; msg.classList.add('err'); return; }
  const conflict = state.leaves.find(l => l.employeeId === employeeId && l.start <= end && l.end >= start);
  if (conflict) { msg.textContent = 'يوجد تداخل مع إجازة مسجّلة لنفس الموظف'; msg.classList.add('err'); return; }

  state.leaves.push({ id: crypto.randomUUID(), employeeId, start, end, source: 'v2' });
  msg.textContent = 'جاري الحفظ…';
  const res = await supabaseFetch('/rest/v1/shift_manager_state?on_conflict=id', {
    method: 'POST',
    headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify({ id: 'main', data: state, updated_at: new Date().toISOString() })
  });
  if (res.ok) { msg.textContent = 'تم الحفظ'; msg.classList.add('ok'); renderAll(); }
  else { msg.textContent = 'تعذر الحفظ'; msg.classList.add('err'); state.leaves.pop(); }
}
</script>
</body>
</html>
